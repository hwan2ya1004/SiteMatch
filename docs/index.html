<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<title>SiteMatch AI 접속 중</title>
<link rel="icon" href="https://sitematch.onrender.com/static/icons/icon-192.png" type="image/png">
<!-- 홈 화면에 추가했을 때 진짜 앱 아이콘이 뜨게 함 — 이게 없으면 iOS/Android가
     이 로딩 페이지 화면을 그대로 캡처해서 아이콘으로 써버려 실제 앱 아이콘과
     달라 보인다. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SiteMatch AI">
<link rel="apple-touch-icon" href="https://sitematch.onrender.com/static/icons/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #0F6E56;
    --teal-mid: #1D9E75;
    --teal-light: #E1F5EE;
    --navy: #0F243E;
    --gray-bg: #F7F8FA;
    --text: #1A1A1A;
    --text-sub: #6B7280;
  }
  html, body {
    height: 100%;
    font-family: 'Pretendard', 'Noto Sans KR', system-ui, -apple-system, sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    overflow: hidden; /* #app-frame이 뜬 뒤에는 이 페이지 자체는 스크롤할 일이 없음 */
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px;
    text-align: center;
  }
  /* 실제 앱은 이 iframe 안에서 열린다 — 주소창은 항상 이 로딩 페이지 주소
     (hwan2ya1004.github.io/SiteMatch) 그대로 유지된다. "홈 화면에 추가"를
     앱 진입 이후에 누르더라도 늘 이 주소가 저장되게 하기 위함 — sitematch.
     onrender.com으로 실제 이동(location.href)해버리면 그 순간부터는 주소가
     바뀌어서 이 로딩 페이지를 만든 의미가 없어진다. */
  #app-frame {
    display: none; position: fixed; inset: 0;
    width: 100%; height: 100%; border: 0; background: #fff; z-index: 10;
  }
  /* 공장 실루엣 + AI 시그널 아크 로고 — 앱 아이콘과 동일한 모티브 */
  .logo-wrap {
    width: 96px; height: 96px; margin: 0 auto 28px;
    display: flex; align-items: center; justify-content: center;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  .logo-wrap svg { width: 100%; height: 100%; }

  h1 { font-size: 19px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.2px; word-break: keep-all; }
  .sub { font-size: 13.5px; color: var(--text-sub); line-height: 1.6; margin-bottom: 28px; word-break: keep-all; }

  .dots { display: inline-flex; gap: 6px; margin-bottom: 22px; }
  .dot { width: 9px; height: 9px; background: var(--teal-mid); border-radius: 50%; animation: bounce 1.2s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  .status {
    font-size: 12.5px; color: var(--text-sub);
    background: var(--teal-light); color: var(--teal);
    display: inline-block; padding: 6px 14px; border-radius: 99px;
    font-weight: 600; transition: all 0.3s;
  }

  .manual-link { margin-top: 28px; font-size: 12px; }
  .manual-link a { color: var(--text-sub); text-decoration: underline; }

  /* 홈 화면 추가 안내 — 이 로딩 페이지 자체를 홈 화면에 추가해야 다음부턴
     이 페이지를 거쳐 앱처럼 열린다 (원래 앱 화면에서 추가하면 sitematch.
     onrender.com이 그대로 저장돼서 콜드스타트 화면을 다시 만나게 됨) */
  .install-hint {
    display: none; margin-top: 20px; padding: 12px 14px;
    background: var(--teal-light); color: var(--teal);
    border-radius: 12px; font-size: 12.5px; line-height: 1.6;
    text-align: left; word-break: keep-all;
  }
  .install-hint strong { color: var(--navy); }

  /* 기다리는 동안 보여줄 진행 표시 — 렌더 무료 서버는 잠들었다 깨는 데 1분 안팎이
     걸려서, 점 세 개만 돌면 멈춘 것처럼 느껴진다는 지적을 받고 추가함 */
  .progress-wrap { margin: 4px 0 6px; }
  .progress { height: 8px; background: #E5E7EB; border-radius: 99px; overflow: hidden; }
  .progress-bar {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, var(--teal-mid), var(--teal));
    transition: width 0.8s ease;
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--text-sub); margin-top: 6px;
  }

  .steps { list-style: none; text-align: left; margin: 18px auto 0; max-width: 260px; }
  .steps li {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #9CA3AF; padding: 5px 0; transition: color 0.3s;
  }
  .steps .mark {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #D1D5DB; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; transition: all 0.3s;
  }
  .steps li.active { color: var(--text); font-weight: 600; }
  .steps li.active .mark { border-color: var(--teal-mid); border-top-color: transparent; animation: spin 0.9s linear infinite; }
  .steps li.done { color: var(--teal); }
  .steps li.done .mark { background: var(--teal-mid); border-color: var(--teal-mid); animation: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tip {
    margin-top: 22px; padding: 14px 16px; min-height: 86px;
    background: #fff; border: 1px solid #E5E7EB; border-radius: 14px;
    text-align: left; transition: opacity 0.4s;
  }
  .tip-label { font-size: 11.5px; font-weight: 700; color: var(--teal-mid); margin-bottom: 6px; }
  .tip-text { font-size: 13.5px; line-height: 1.6; color: var(--text); word-break: keep-all; }
  .tip-dots { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
  .tip-dots span { width: 6px; height: 6px; border-radius: 50%; background: #D1D5DB; transition: background 0.3s; }
  .tip-dots span.on { background: var(--teal-mid); }

  #app-frame { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  #app-frame.ready { opacity: 1; pointer-events: auto; }
</style>
<link rel="preconnect" href="https://sitematch.onrender.com">
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <svg viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- AI 시그널 아크 -->
      <path d="M95 118 A55 55 0 0 1 205 118" stroke="#0D9488" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
      <path d="M110 122 A40 40 0 0 1 190 122" stroke="#0D9488" stroke-width="10" stroke-linecap="round"/>
      <circle cx="150" cy="72" r="9" fill="#0D9488"/>
      <!-- 공장 몸체 -->
      <rect x="80" y="150" width="140" height="70" rx="6" fill="#0F243E"/>
      <!-- 톱니 지붕 -->
      <path d="M80 150 L103 118 L126 150 L149 118 L172 150 L195 118 L220 150 Z" fill="#0F243E"/>
      <!-- 창문 -->
      <rect x="100" y="172" width="18" height="24" fill="#F7F8FA"/>
      <rect x="141" y="172" width="18" height="24" fill="#F7F8FA"/>
      <rect x="182" y="172" width="18" height="24" fill="#F7F8FA"/>
    </svg>
  </div>

  <h1>SiteMatch AI를 불러오는 중입니다</h1>
  <p class="sub" id="sub-text">
    잠시만 기다려주세요 — 처음 접속하시는 경우 서버를 깨우는 데 최대 1분 정도 걸릴 수 있어요.
  </p>

  <div class="progress-wrap">
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-meta">
      <span id="elapsed">0초 지남</span>
      <span>보통 1분 안팎 걸려요</span>
    </div>
  </div>

  <ul class="steps">
    <li id="step-1" class="active"><span class="mark"></span>서버 깨우는 중</li>
    <li id="step-2"><span class="mark"></span>산업단지 정보 준비</li>
    <li id="step-3"><span class="mark"></span>화면 여는 중</li>
  </ul>

  <div class="tip" id="tip">
    <div class="tip-label">기다리는 동안 알아두세요</div>
    <div class="tip-text" id="tip-text"></div>
    <div class="tip-dots" id="tip-dots"></div>
  </div>

  <span class="status" id="status-pill" style="display:none"></span>

  <div class="manual-link">
    자동으로 안 넘어가면 <a href="#" id="manual-link-btn">여기를 눌러주세요</a>
  </div>

  <div class="install-hint" id="install-hint">
    <span id="install-hint-text"></span>
  </div>
</div>

<iframe id="app-frame" allow="geolocation" title="SiteMatch AI"></iframe>

<script>
const TARGET = 'https://sitematch.onrender.com/';
const startedAt = Date.now();
let attempts = 0;

// 홈 화면에 추가 안내 — 이미 홈 화면 앱(standalone)으로 실행 중이면 당연히
// 필요 없고, iOS/Android가 아니면(PC) 의미가 없어서 그때만 보여준다.
const isStandalone = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
const isAndroid = /Android/.test(ua);
const showInstallHint = !isStandalone && (isIOS || isAndroid);
// 안내를 보여줄 땐, 서버가 이미 깨어있어서 순식간에 넘어가더라도 최소
// 이만큼은 이 화면에 머물게 해서 안내를 알아챌 시간을 준다.
const MIN_STAY_MS = 5000;

if (showInstallHint) {
  const text = isIOS
    ? '📲 <strong>이 화면을 홈 화면에 추가</strong>해두면 다음부턴 이 로딩 화면을 거쳐 앱처럼 바로 열려요 — 하단 공유 아이콘 ⬆️ 을 누르고 "홈 화면에 추가"를 선택해주세요'
    : '📲 <strong>이 화면을 홈 화면에 추가</strong>해두면 다음부턴 이 로딩 화면을 거쳐 앱처럼 바로 열려요 — 우측 상단 메뉴 ⋮ 를 누르고 "홈 화면에 추가"를 선택해주세요';
  document.getElementById('install-hint-text').innerHTML = text;
  document.getElementById('install-hint').style.display = 'block';
}

// 기다리는 동안 돌려 보여줄 안내 — 서비스에 실제로 있는 기능·실제 데이터만 적는다
const TIPS = [
  '전국 산업단지 약 1,400곳을 한 번에 비교해요. 국가·일반·도시첨단·농공단지가 모두 들어 있어요.',
  '업종을 고르면 단지마다 <strong>입주 가능 · 조건부 · 불가</strong>를 바로 알려드려요.',
  '입주 업종은 시·도와 시·군이 낸 <strong>관리기본계획 고시문</strong>을 직접 읽어 정리했어요.',
  '지도에서 단지를 누르면 관리기관과, 고시문에 적힌 담당 부서 전화번호를 볼 수 있어요.',
  'AI 상담에 "○○산업단지에 식품공장 들어갈 수 있어?"처럼 편하게 물어보세요.',
  '아직 짓는 중이거나 보상 중인 단지도 표시돼요. 이런 곳은 입주 일정을 꼭 확인하세요.',
  '산업통상자원부 공공데이터 활용 아이디어 공모전 우수상을 받은 서비스예요.',
];
const tipTextEl = document.getElementById('tip-text');
const tipBox = document.getElementById('tip');
const tipDots = document.getElementById('tip-dots');
TIPS.forEach(() => tipDots.appendChild(document.createElement('span')));
let tipIndex = Math.floor(Math.random() * TIPS.length);
function renderTip() {
  tipTextEl.innerHTML = TIPS[tipIndex];
  [...tipDots.children].forEach((d, i) => d.classList.toggle('on', i === tipIndex));
}
renderTip();
const tipTimer = setInterval(() => {
  tipBox.style.opacity = 0;
  setTimeout(() => { tipIndex = (tipIndex + 1) % TIPS.length; renderTip(); tipBox.style.opacity = 1; }, 400);
}, 6000);

// 진행 막대는 "예상" 진행률 — 서버가 실제로 몇 %인지 알 수는 없어서, 보통 걸리는
// 시간(약 60초)에 맞춰 천천히 차오르다 90%에서 멈추고, 실제로 준비되면 끝까지 채운다.
const EXPECTED_MS = 60000;
const barEl = document.getElementById('progress-bar');
const elapsedEl = document.getElementById('elapsed');
let finished = false;
const progressTimer = setInterval(() => {
  if (finished) return;
  const t = Date.now() - startedAt;
  const pct = 90 * (1 - Math.exp(-2.2 * t / EXPECTED_MS));
  barEl.style.width = pct.toFixed(1) + '%';
  elapsedEl.textContent = Math.floor(t / 1000) + '초 지남';
}, 500);

function setStep(n) {
  [1, 2, 3].forEach(i => {
    const li = document.getElementById('step-' + i);
    li.className = i < n ? 'done' : (i === n ? 'active' : '');
  });
}

let shown = false;
function showApp() {
  if (shown) return;
  shown = true;
  setStep(3);
  const frame = document.getElementById('app-frame');
  // 서버가 깨어난 뒤에도 앱 화면 자체를 받는 데 몇 초 더 걸린다. 예전엔 바로 빈
  // iframe으로 바꿔서 흰 화면만 보였는데, 이제 다 열릴 때까지 이 화면을 유지한다.
  frame.addEventListener('load', () => {
    finished = true;
    clearInterval(progressTimer);
    clearInterval(tipTimer);
    barEl.style.width = '100%';
    setStep(4);
    setTimeout(() => {
      document.title = 'SiteMatch AI';
      document.querySelector('.card').style.display = 'none';
      frame.classList.add('ready');
    }, 350);
  }, { once: true });
  frame.style.display = 'block';
  // iframe 안 문서는 바깥 페이지를 강력 새로고침해도 브라우저가 예전 저장본을 그대로
  // 쓰는 경우가 있어(사업자정보를 바꿨는데 계속 옛 값이 보였음), 매번 다른 주소로 불러온다.
  frame.src = TARGET + '?v=' + Date.now();
}

document.getElementById('manual-link-btn').addEventListener('click', (e) => {
  e.preventDefault();
  showApp();
});

async function checkAndRedirect() {
  attempts++;
  const elapsed = Date.now() - startedAt;

  // 시간이 지날수록 안심시키는 문구로 교체 (계속 같은 문구만 뜨면
  // 멈춘 것처럼 느껴질 수 있어서)
  const subEl = document.getElementById('sub-text');
  const pillEl = document.getElementById('status-pill');
  if (elapsed > 75000) {
    subEl.innerHTML = '평소보다 조금 오래 걸리고 있어요. 계속 시도하고 있으니 잠시만요.';
  } else if (elapsed > 40000) {
    subEl.innerHTML = '거의 다 됐어요. 조금만 더 기다려주세요.';
  } else if (elapsed > 15000) {
    subEl.innerHTML = '잠들어 있던 서버를 깨우고 있어요. 한동안 아무도 접속하지 않으면 서버가 쉬어서 처음 한 번은 시간이 걸려요.';
  }

  try {
    const resp = await fetch(TARGET + 'health', { cache: 'no-store', mode: 'cors' });
    // Render 콜드 스타트 중에는 200이 와도 우리 서버의 실제 JSON이 아니라
    // 중계 페이지가 응답할 수 있어 — JSON 파싱과 status 필드까지 확인해야
    // "진짜 준비 완료"로 판단할 수 있다.
    const data = await resp.json();
    if (resp.ok && data && data.status === 'ok') {
      if (showInstallHint && elapsed < MIN_STAY_MS) {
        // 서버는 이미 준비됐지만, 설치 안내를 볼 시간을 조금 더 준다
        setTimeout(checkAndRedirect, MIN_STAY_MS - elapsed);
        return;
      }
      setStep(2);
      // 여기서 location.href로 이동하지 않는다 — 이동하면 주소창이
      // sitematch.onrender.com으로 바뀌어서, 앱에 들어간 뒤에 "홈 화면에
      // 추가"를 누르면 그 주소가 저장돼버린다. 대신 이 페이지 안에 iframe으로
      // 띄워서 주소창은 항상 이 로딩 페이지 주소 그대로 유지한다.
      showApp();
      return;
    }
  } catch (e) {
    // 아직 안 깨어남 — 무시하고 재시도
  }

  setTimeout(checkAndRedirect, 3000);
}

checkAndRedirect();
</script>

</body>
</html>
